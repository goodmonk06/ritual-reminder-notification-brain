version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ritual-reminder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ritual_reminder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritual-reminder-brain
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ritual_reminder?schema=public
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: info
      NOTIFICATION_HUB_URL: http://localhost:4000
      REMINDER_CHECK_INTERVAL: "*/1 * * * *"
    ports:
      - "3000:3000"
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres_data:
